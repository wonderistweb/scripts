<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Webflow Clipboard</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #0e0e0e;
        color: #f0f0f0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem;
      }

      .card {
        background: #1a1a1a;
        border: 1px solid #2a2a2a;
        border-radius: 12px;
        padding: 2rem;
        width: 100%;
        max-width: 560px;
        display: flex;
        flex-direction: column;
        gap: 1.25rem;
      }

      h1 {
        font-size: 1.1rem;
        font-weight: 600;
        color: #fff;
      }

      p {
        font-size: 0.875rem;
        color: #888;
        line-height: 1.5;
      }

      textarea {
        width: 100%;
        height: 180px;
        background: #111;
        border: 2px solid #2a2a2a;
        border-radius: 8px;
        color: #f0f0f0;
        font-family: "SF Mono", "Fira Code", monospace;
        font-size: 0.75rem;
        line-height: 1.5;
        padding: 0.875rem;
        resize: vertical;
        outline: none;
        transition: border-color 0.15s;
      }

      textarea::placeholder {
        color: #444;
      }

      textarea:focus {
        border-color: #444;
      }

      textarea.loaded {
        border-color: #3a3a3a;
      }

      button {
        width: 100%;
        padding: 0.75rem 1rem;
        border-radius: 8px;
        border: none;
        font-size: 0.9rem;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.15s, opacity 0.15s;
        background: #fff;
        color: #0e0e0e;
      }

      button:disabled {
        opacity: 0.3;
        cursor: not-allowed;
      }

      button:not(:disabled):hover {
        background: #e0e0e0;
      }

      .status {
        font-size: 0.8rem;
        text-align: center;
        min-height: 1.2em;
        transition: color 0.2s;
      }

      .status.success { color: #4caf7d; }
      .status.error { color: #e05c5c; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Webflow Clipboard</h1>
      <p>Paste your Webflow component JSON below, then click Copy and paste it directly into the Webflow Designer.</p>

      <textarea id="jsonInput" placeholder="Paste JSON here..."></textarea>

      <button id="copyBtn" disabled>Copy to Clipboard</button>

      <div class="status" id="status"></div>
    </div>

    <script>
      const jsonInput = document.getElementById("jsonInput");
      const copyBtn = document.getElementById("copyBtn");
      const status = document.getElementById("status");

      jsonInput.addEventListener("input", () => {
        const val = jsonInput.value.trim();
        if (!val) {
          copyBtn.disabled = true;
          jsonInput.classList.remove("loaded");
          showStatus("");
          return;
        }
        try {
          JSON.parse(val);
          copyBtn.disabled = false;
          jsonInput.classList.add("loaded");
          showStatus("");
        } catch {
          copyBtn.disabled = true;
          jsonInput.classList.remove("loaded");
          showStatus("Invalid JSON.", "error");
        }
      });

      copyBtn.addEventListener("click", () => {
        const val = jsonInput.value.trim();
        if (!val) return;
        try {
          document.addEventListener("copy", (e) => {
            e.clipboardData.setData("application/json", val);
            e.preventDefault();
          }, { once: true });
          document.execCommand("copy");
          showStatus("Copied! Now paste in the Webflow Designer.", "success");
        } catch (err) {
          showStatus("Copy failed: " + err.message, "error");
        }
      });

      function showStatus(msg, type = "") {
        status.textContent = msg;
        status.className = "status " + type;
      }
    </script>
  </body>
</html>
