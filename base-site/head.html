<!-- Plyr.io CSS -->
<link
  rel="preload"
  as="style"
  href="https://cdn.plyr.io/3.7.2/plyr.css"
  onload="this.onload=null;this.rel='stylesheet';"
/>

<!-- Plyr.io VIDEO EMBEDS -->
<style>
  :root {
    --plyr-color-main: white;
    --plyr-tab-focus-color: transparent;
    --plyr-video-control-color-hover: black;
    --plyr-control-icon-size: 1.5em;
    --plyr-range-thumb-height: 0px;
    --plyr-range-track-height: 0.6em;
  }
  .plyr__control--overlaid {
    color: black;
  }

  /* Volume slider sizing */
  .plyr__volume {
    width: auto;
    min-width: auto;
    max-width: auto;
  }

  /* Base Plyr container */
  .plyr {
    width: 100%;
    height: 100%;
  }

  .plyr video {
    object-fit: cover;
  }

  /* Remove built-in aspect ratio for custom layouts */
  .plyr__video-embed__container {
    padding-top: 56.25% !important;
    padding-bottom: 0 !important;
    transform: translateY(0%) !important;
  }

  /* Ensure iframe fills */
  .plyr__video-embed__container iframe {
    width: 100% !important;
    height: 100% !important;
  }

  /* Webflow rich-text + Plyr iframe fix */
  .plyr_embed.w-richtext > .w-embed.w-iframe {
    height: 100% !important;
  }

  /* Cover image fade-out */
  .hide-cover .plyr_cover {
    opacity: 0;
    pointer-events: none;
  }

  .hide-cover .plyr_cover-img {
    transform: scale(1.4);
  }
</style>
